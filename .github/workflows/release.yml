name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_name: klip-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_name: klip-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p klip-cli

      - name: Package CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-release
          tar -C target/${{ matrix.target }}/release -czf dist-release/${{ matrix.cli_name }} klip

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/klip.exe -DestinationPath dist-release/${{ matrix.cli_name }}

      - name: Build Desktop App
        working-directory: apps/desktop
        run: bunx tauri build --target ${{ matrix.target }}

      - name: Collect Desktop Bundles (macOS)
        if: runner.os == 'macOS'
        run: |
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-release/

      - name: Collect Desktop Bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*.exe | Copy-Item -Destination dist-release/
          Get-ChildItem target/${{ matrix.target }}/release/bundle/msi/*.msi | Copy-Item -Destination dist-release/

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" dist-release/* --clobber
